name: Release

# AGENTS §15.1：新 tag 使用纯 semver（0.1.0/0.2.0），不再新增 mimi-v* 前缀。
# 旧配置只监听 mimi-v*，导致 0.1.x 系列 tag 永远无法触发发布——0.34.33 修复。
# mimi-v* 保留匹配仅为兼容历史 tag 重推场景。
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "mimi-v*"

env:
  # llvm-sys 版本为 181.3.0（Cargo.lock）。此变量历史上误写为 LLVM_SYS_180_PREFIX，
  # 与 llvm-sys 期望的 181 不匹配，导致发布构建找不到 LLVM——0.34.33 修复。
  LLVM_SYS_181_PREFIX: /tmp/llvm-wrapper
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-mimi

      # ── 发布前冒烟：release 构建必须能检查真实 Mimi 源码 ──────────
      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test (mimi check)
        run: |
          printf 'func main() -> i32 {\n    0\n}\n' > /tmp/release-smoke.mimi
          ./target/release/mimi check /tmp/release-smoke.mimi

      # ── 打包 + 校验和（供应链卫生：0.34.33 补 sha256）──────────────
      - name: Strip binary
        run: strip target/release/mimi

      - name: Create release archive
        run: |
          # 兼容历史 mimi-v* 前缀：有则剥离，纯 semver 原样保留
          VERSION="${GITHUB_REF_NAME#mimi-v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp target/release/mimi dist/
          cp README.md LICENSE dist/
          cd dist
          tar czf "../mimi-${VERSION}-x86_64-linux.tar.gz" .
          cd ..
          sha256sum "mimi-${VERSION}-x86_64-linux.tar.gz" > "mimi-${VERSION}-x86_64-linux.tar.gz.sha256"
          cat "mimi-${VERSION}-x86_64-linux.tar.gz.sha256"

      # 发布说明只取本版本 CHANGELOG 小节（旧配置整文件灌入每个 release body）；
      # 找不到对应小节时回退全文，保证 body 非空。
      - name: Extract release notes
        run: |
          awk -v v="$RELEASE_VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG 中未找到 [$RELEASE_VERSION] 小节，回退全文"
            cp CHANGELOG.md release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mimi ${{ env.RELEASE_VERSION }}
          body_path: release-notes.md
          files: |
            mimi-${{ env.RELEASE_VERSION }}-x86_64-linux.tar.gz
            mimi-${{ env.RELEASE_VERSION }}-x86_64-linux.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
