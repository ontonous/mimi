name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送直接顶掉旧流水线（0.34.33：原配置无 concurrency，重复全量跑浪费 runner）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # llvm-sys 181.3.0（Cargo.lock）——历史上 release.yml 误写 180 导致发布构建找不到 LLVM
  LLVM_SYS_181_PREFIX: /tmp/llvm-wrapper
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Static Gates
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mimi

      # ── 静态门禁先行（秒级，失败最快路径）──────────────────────────
      - name: Language docs gate (spec 同步闸 + 语义新鲜度)
        run: python3 scripts/check_language_docs.py

      - name: unsafe SAFETY gate (non-runtime baseline)
        run: python3 scripts/check_unsafe_safety.py

      - name: v0.31 roadmap consistency check
        run: python3 scripts/check_v031_roadmap.py

      # ── Rust 质量门禁 ──────────────────────────────────────────────
      - name: Check Format
        run: cargo fmt -- --check

      - name: Pre-build runtime (prime cache)
        run: rustc --edition 2021 --crate-type staticlib --cfg standalone --crate-name mimi_runtime -o /tmp/mimi_runtime_test.a src/runtime/standalone.rs

      - name: Clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mimi

      - name: Pre-build runtime (prime cache)
        run: rustc --edition 2021 --crate-type staticlib --cfg standalone --crate-name mimi_runtime -o /tmp/mimi_runtime_test.a src/runtime/standalone.rs

      - name: Build
        run: cargo build --workspace

      # ── 分层不变量门禁（AGENTS §14.1/§15.3）────────────────────────
      - name: L1 dual-backend equivalence
        run: cargo test dual_ -- --test-threads=2

      - name: L2 type-system soundness
        run: "cargo test typecheck:: -- --test-threads=2"

      - name: FFI contract equivalence
        run: cargo test ffi_ -- --test-threads=2

      - name: Codegen E2E
        run: cargo test codegen_e2e -- --test-threads=2

      # Z3 arena 不归还内存（AGENTS §3）：验证套件单线程隔离跑，避免与
      # 并发测试进程叠加。实测（0.34.33）：27 项峰值 RSS ~124MB，风险已收敛，
      # 隔离步骤保留为纪律性门禁。
      - name: Z3 verification (single-threaded, AGENTS §3)
        run: cargo test v1_2_verification -- --test-threads=1

      # ── 全量兜底（AGENTS §3 OOM 防护：ulimit 超限即 kill，不冻 runner）──
      # 线程数公式（0.34.33 实测，32 核机）：--test-threads 对齐 vCPU 数；
      #   4→39.5s/289MB，8→28.8s/390MB，16→24.1s/551MB，32→23.3s/924MB。
      #   16 为拐点（再翻倍只快 3.7%），内存 ~+23MB/线程。
      # GH 标准 runner = 2 vCPU → --test-threads=2（对齐核心数，非保守猜测）。
      # runner 升级大机型时按 vCPU 数同比例上调，无需担心内存。
      - name: Test (full suite, OOM-guarded)
        run: |
          ulimit -v 20000000
          cargo test -- --test-threads=2

      # 已知差距（#[ignore]）必须编译且允许失败（AGENTS §15.3 ⚠ 理想门禁收编）。
      # 当前 7 个 ignored 均为工具门禁（ASan/UBSan/Valgrind×6 + Z3×1），
      # 工具链缺失时在运行时优雅跳过。
      - name: Known gaps (ignored tests, advisory)
        if: always()
        continue-on-error: true
        run: cargo test -- --ignored --test-threads=1

      # ── 性能门禁（0.35.46，C2 教训闭环）──────────────────────────
      # release 构建 + 宽松阈值，只拦截灾难性回退（native dsp >3× C -O2 或
      # VM dsp >20s），不拦截共享 runner 噪声。细粒度复测仍用本地 quadrant.sh。
      - name: Performance gate (release, gross-regression only)
        run: bash scripts/perf-gate.sh
