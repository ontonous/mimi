name: setup-mimi
description: >-
  Shared environment bootstrap for the Mimi compiler: LLVM 18 + wrapper stub,
  system deps (z3/ffi/binutils), Rust toolchain (clippy/rustfmt), and cargo cache.
  Single source of truth so lint/test/release jobs cannot drift apart.

runs:
  using: composite
  steps:
    - name: Install LLVM 18 + system deps
      shell: bash
      run: |
        # apt-key is deprecated; install the LLVM signing key into a keyring instead.
        wget -qO /tmp/llvm-key.gpg https://apt.llvm.org/llvm-snapshot.gpg.key
        sudo gpg --yes --dearmor -o /usr/share/keyrings/apt-llvm.gpg /tmp/llvm-key.gpg
        echo "deb [signed-by=/usr/share/keyrings/apt-llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update -qq
        sudo apt-get install -y -qq llvm-18-dev llvm-18 libllvm18 libclang-18-dev 2>&1 | tail -5
        # libpolly-18-dev may be absent on some mirrors; the wrapper stubs it.
        sudo apt-get install -y libpolly-18-dev 2>&1 || echo "Polly dev not found; wrapper will stub it"
        sudo apt-get install -y -qq libz3-dev libffi-dev binutils

    - name: Setup LLVM wrapper
      shell: bash
      run: bash scripts/setup-llvm-wrapper.sh

    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "mimi-ci"
