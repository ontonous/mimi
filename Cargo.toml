[package]
name = "mimi"
version = "0.1.10-dev"
edition = "2021"
rust-version = "1.75"
authors = ["ontonous"]
description = "Mimi language reference implementation (Rust)"
license = "Apache-2.0"
homepage = "https://github.com/ontonous/mimi"
repository = "https://github.com/ontonous/mimi"
documentation = "https://github.com/ontonous/mimi#readme"

[lib]
name = "mimi"
path = "src/lib.rs"

[[bin]]
name = "mimi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
z3 = "0.20.0"
inkwell = { version = "0.9", features = ["llvm18-1"] }
# This direct dependency only re-exports the host-only build feature below.
# Inkwell keeps llvm-sys optional, so without this edge Cargo cannot expose
# llvm-sys' `disable-alltargets-init` feature from the root manifest.
llvm-sys = { version = "181.3.0", default-features = false }
semver = "1.0"
libc = "0.2"
thiserror = "2"
libffi = { version = "4.1", features = ["system"] }
either = "1.16.0"
regex = "1"
blake3 = "1"

[features]
default = []
no_std = []
# Enable deliberate UB test symbols (test_segfault / test_abort) outside cargo test.
test_ub_symbols = []
# Reproducible native validation on a host LLVM 18 installation.  The target
# wrapper generated by llvm-sys is disabled because it is compiled from the
# installed LLVM headers and would otherwise make a mismatched multi-target
# installation look linkable.  Native target initialization remains enabled.
llvm18-host-dynamic = [
    "inkwell/llvm18-1-force-dynamic",
    "llvm-sys/disable-alltargets-init",
]

[build-dependencies]
# build.rs is a no-op (runtime is pure Rust since v0.15)

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser"
path = "benches/parser.rs"
harness = false

[[bench]]
name = "codegen"
path = "benches/codegen.rs"
harness = false

[[bench]]
name = "interp"
path = "benches/interp.rs"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
